<title>HomeBase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --fs:14px;
  --bg:#FAF7F2; --card:#FFFFFF; --ink:#1C1F2A; --on-ink:#FFFFFF; --muted:#6B6F7A; --line:#E8E2D7; --soft:#F1EEE8;
  --saffron:#E8891C; --red:#C8463D; --green:#3F8F5B; --blue:#3C6E9F;
  --red-soft:#FBEAE8; --green-soft:#E7F3EB; --blue-soft:#E6EEF6; --shadow:rgba(28,31,42,.12);
  --accent-soft:color-mix(in srgb,var(--saffron) 13%,var(--card));
  --accent-text:color-mix(in srgb,var(--saffron) 72%,var(--ink));
}
html[data-theme=dark]{
  --bg:#121419; --card:#1C1F27; --ink:#ECEDF0; --on-ink:#121419; --muted:#9A9EAA; --line:#2C303B; --soft:#262A34;
  --red:#E8766D; --green:#5DBB7E; --blue:#7FA9D6;
  --red-soft:#3A2224; --green-soft:#1F3328; --blue-soft:#1F2B3A; --shadow:rgba(0,0,0,.45);
}
html{font-size:var(--fs)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:1rem;line-height:1.4;-webkit-text-size-adjust:100%}
img,video,iframe,embed{max-width:100%;height:auto}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:6rem}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(.7rem + env(safe-area-inset-top)) 1rem .5rem;position:sticky;top:0;background:var(--bg);z-index:5}
h1{font-family:Fraunces,serif;font-size:1.5rem;letter-spacing:-.4px;-webkit-user-select:none;user-select:none;cursor:default}
h1 span{color:var(--saffron)}
h2{font-family:Fraunces,serif;font-size:1.25rem;margin:.2rem 0 .6rem}
h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:600;margin:1rem 0 .4rem}
main{padding:0 1rem}
.iconbtn{background:none;border:1px solid var(--line);border-radius:.6rem;width:2.4rem;height:2.4rem;font-size:1.1rem;cursor:pointer;flex-shrink:0;color:var(--ink);position:relative}
.iconbtn::after{content:'';position:absolute;inset:-4px}
.iconbtn.sm{width:2rem;height:2rem;font-size:.9rem}
.sub{color:var(--muted);font-size:.85rem}
.sub a{display:inline-block;padding:.5rem .2rem;margin:-.5rem 0;font-weight:600;color:var(--saffron)}
.card{background:var(--card);border:1px solid var(--line);border-radius:.8rem;padding:.6rem .8rem;margin-bottom:.5rem}
.row{display:flex;align-items:center;gap:.6rem}
.grow{flex:1;min-width:0}
.title{font-weight:600;overflow-wrap:anywhere}
.meta{font-size:.82rem;color:var(--muted);margin-top:1px;display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.pill{font-size:.7rem;font-weight:600;padding:.08rem .45rem;border-radius:99px;white-space:nowrap}
.p-high,.late{background:var(--red-soft);color:var(--red)}
.p-medium,.soon{background:var(--accent-soft);color:var(--accent-text)}
.p-low{background:var(--blue-soft);color:var(--blue)}
.ok{background:var(--green-soft);color:var(--green)}
.later{background:var(--soft);color:var(--muted)}
.thumb{width:2.6rem;height:2.6rem;border-radius:.5rem;object-fit:cover;flex-shrink:0}
.full{width:100%;border-radius:.6rem;margin:.6rem 0;max-height:360px;object-fit:cover}
.check{width:1.65rem;height:1.65rem;border-radius:50%;border:2px solid var(--line);background:var(--card);cursor:pointer;flex-shrink:0;font-size:.85rem;color:transparent;position:relative}
.check::after{content:'';position:absolute;inset:-.6rem}
.check.on{background:var(--green);border-color:var(--green);color:#fff}
.done .title{text-decoration:line-through;color:var(--muted)}
.actions{display:flex;gap:.4rem;margin-top:.6rem;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:.6rem;padding:.4rem .8rem;min-height:2.3rem;font:inherit;font-size:.88rem;font-weight:500;cursor:pointer;color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.btn.accent{background:var(--saffron);color:#fff;border-color:var(--saffron)}
.btn.danger{color:var(--red)}
.chips{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:2px;margin-bottom:.6rem;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:.35rem .85rem;min-height:2.2rem;font-size:.88rem;cursor:pointer;white-space:nowrap;font-family:inherit;color:var(--ink)}
.chip.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.stat{background:var(--card);border:1px solid var(--line);border-radius:.8rem;padding:.6rem .75rem;cursor:pointer}
.stat .n{font-family:Fraunces,serif;font-size:1.35rem;font-weight:700}
.stat .l{font-size:.76rem;color:var(--muted)}
.stat.hl{background:var(--ink);color:var(--on-ink);border-color:var(--ink)} .stat.hl .l{color:color-mix(in srgb,var(--on-ink) 70%,var(--ink))}
.empty{text-align:center;color:var(--muted);padding:1.6rem .6rem;font-size:.88rem}
.bar{height:5px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--saffron)}
.catrow{justify-content:space-between;font-size:.88rem}
.summary{display:flex;justify-content:space-between;gap:.6rem}
.summary div{flex:1}
.summary b{display:block;font-family:Fraunces,serif;font-size:1.12rem}
.monthnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem}
.mtitle{font-family:Fraunces,serif;font-size:1.1rem;font-weight:700}
.mtitle.big{font-size:1.4rem}
.quickadd{display:flex;gap:.4rem;margin-bottom:.6rem}
.quickadd input{flex:1}
.quickadd input[name=qty]{max-width:5rem}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav .inner{display:flex;max-width:560px;width:100%}
nav button{flex:1;min-width:0;min-height:3.3rem;background:none;border:none;padding:.4rem 0 .5rem;font:inherit;font-size:.7rem;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
nav button .ic{font-size:1.2rem;filter:grayscale(1);opacity:.55}
nav button.on{color:var(--ink);font-weight:600}
nav button.on .ic{filter:none;opacity:1}
.fab{position:fixed;bottom:calc(4.2rem + env(safe-area-inset-bottom));right:max(1rem,calc(50% - 264px));width:3.2rem;height:3.2rem;border-radius:50%;background:var(--saffron);color:#fff;font-size:1.6rem;border:none;box-shadow:0 6px 16px color-mix(in srgb,var(--saffron) 40%,transparent);cursor:pointer;z-index:11}
.overlay{position:fixed;inset:0;background:rgba(10,12,18,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:1.1rem 1.1rem 0 0;padding:1.1rem 1rem 1.6rem;max-height:92vh;overflow-y:auto}
label{display:block;font-size:.82rem;font-weight:600;margin:.7rem 0 .3rem}
input,select,textarea{width:100%;min-width:0;min-height:2.6rem;border:1px solid var(--line);background:var(--card);border-radius:.6rem;padding:.5rem .7rem;font:inherit;font-size:max(16px,1rem);color:var(--ink)}
textarea{min-height:4.5rem;resize:vertical}
.photobox{border:1.5px dashed var(--line);border-radius:.7rem;padding:.8rem;text-align:center;cursor:pointer;background:var(--card);color:var(--muted);font-size:.88rem}
.photobox img{max-width:100%;max-height:200px;border-radius:.5rem;display:block;margin:0 auto}
.formbtns{display:flex;gap:.5rem;margin-top:1.1rem}
.formbtns .btn{flex:1;min-height:2.7rem}
.choose{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem;margin-top:.5rem}
.choose button{background:var(--card);border:1px solid var(--line);border-radius:.8rem;padding:.8rem .3rem;font:inherit;font-size:.82rem;color:var(--ink);cursor:pointer}
.choose button span{display:block;font-size:1.4rem;margin-bottom:2px}
.toast{position:fixed;bottom:calc(8rem + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--on-ink);padding:.4rem .4rem .4rem .9rem;border-radius:.6rem;font-size:.88rem;z-index:30;display:flex;align-items:center;gap:.5rem;max-width:calc(100vw - 32px);box-shadow:0 6px 18px var(--shadow)}
.toast button{background:none;border:none;color:var(--saffron);font:inherit;font-weight:700;cursor:pointer;padding:0 .7rem;min-height:2.4rem;text-transform:uppercase;letter-spacing:.5px}
.src{font-size:1.1rem;width:1.8rem;text-align:center;flex-shrink:0}
.swatch{width:2.2rem;height:2.2rem;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.swatch.on{box-shadow:0 0 0 2px var(--ink)}
.adminrow{margin-bottom:.9rem}

<div class="app">
  <header>
    <h1 id="ptitle" onclick="titleTap()">Home<span>Base</span></h1>

<script>
/* ---------- storage ---------- */
const KEY = 'homebase.v1';
const blank = () => ({settings:{whoami:'a'},people:{a:'Hari',b:'Wife'},tasks:[],obligations:[],paid:{},expenses:[],subs:[],reminders:[],groceries:[],help:[],dates:[]});
let S;
function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw) return Object.assign(blank(), JSON.parse(raw)); }catch(e){}
  return seed();
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast('Storage is full — delete some old photos'); }
  if(typeof cloudSchedulePush==='function') cloudSchedulePush();
}
function seed(){ return blank(); }

/* ---------- helpers ---------- */
function uid(){ return Math.random().toString(36).slice(2,10); }
function pad(n){ return String(n).padStart(2,'0'); }
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parse(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); }
function today(){ return ymd(new Date()); }
function addDays(s,n){ const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); }
function addMonths(s,n){
  const d = parse(s), day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n);
  d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth()+1, 0).getDate())); return ymd(d);
}
function daysUntil(s){ return Math.round((parse(s) - parse(today()))/864e5); }
function monthKey(s){ return (s||today()).slice(0,7); }
function fmtDate(s){ return parse(s).toLocaleDateString('en-IN',{day:'numeric',month:'short'}); }
function monthName(k){ const [y,m]=k.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'}); }
function inr(n){ return '₹' + Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:0}); }
function esc(s){ return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function dueTag(s){
  if(!s) return '';
  const n = daysUntil(s);
  if(n<0) return `<span class="pill late">${-n}d overdue</span>`;
  if(n===0) return `<span class="pill late">Today</span>`;
  if(n===1) return `<span class="pill soon">Tomorrow</span>`;
  if(n<=7) return `<span class="pill soon">In ${n} days</span>`;
  return `<span class="pill later">${fmtDate(s)}</span>`;
}
function me(){ return S.settings.whoami==='b' ? 'b' : 'a'; }
function other(){ return me()==='a' ? 'b' : 'a'; }
function who(a){ return a==='both' ? 'Both' : (S.people?.[a] || a); }
function oblDue(o, mk){ const [y,m]=mk.split('-').map(Number); const dim=new Date(y,m,0).getDate(); return `${mk}-${pad(Math.min(o.dueDay,dim))}`; }
function isPaid(key, mk){ return (S.paid[mk]||[]).includes(key); }
function nextOccurrence(s){
  const d = parse(s), t = parse(today());
  let n = new Date(t.getFullYear(), d.getMonth(), d.getDate());
  if(n < t) n = new Date(t.getFullYear()+1, d.getMonth(), d.getDate());
  return ymd(n);
}
let toastTimer;
function toast(msg, undo){
  document.querySelectorAll('.toast').forEach(t=>t.remove()); clearTimeout(toastTimer);
  const el = document.createElement('div'); el.className='toast';
  const span = document.createElement('span'); span.textContent = msg; el.appendChild(span);
  if(undo){ const b=document.createElement('button'); b.textContent='Undo';
    b.onclick=()=>{ undo(); el.remove(); clearTimeout(toastTimer); }; el.appendChild(b); }
  document.body.appendChild(el); toastTimer = setTimeout(()=>el.remove(), undo ? 6000 : 2200);
}
function compress(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = () => { const img = new Image();
      img.onload = () => { const max=900; let w=img.width, h=img.height;
        if(w>h && w>max){ h=h*max/w; w=max; } else if(h>max){ w=w*max/h; h=max; }
        const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
        res(c.toDataURL('image/jpeg',0.65)); };
      img.onerror = rej; img.src = r.result; };
    r.onerror = rej; r.readAsDataURL(file);
  });
}


/* ---------- one-time import of bills from VarSel ---------- */
function importVarsel(){
  if(S.varselImported) return;
  const has = (col,name) => S[col].some(x => (x.name||x.title||'').toLowerCase() === name.toLowerCase());
  const months = (from,to) => { const out=[]; let m=from; while(m<=to){ out.push(m); m=monthKey(addMonths(m+'-01',1)); } return out; };
  const bills = [
    {name:'Personal Loan',    amount:11062, category:'Loan / EMI', startMonth:'2026-04', paid:months('2026-04','2026-10')},
    {name:'Car Loan',         amount:0,     category:'Loan / EMI', startMonth:'2026-04', endMonth:'2026-06', paid:months('2026-04','2026-06')},
    {name:'Home Loan',        amount:0,     category:'Loan / EMI', startMonth:'2026-04', paid:months('2026-04','2026-10')},
    {name:'Home Loan Extra',  amount:0,     category:'Loan / EMI', startMonth:'2026-05', paid:months('2026-05','2026-10')},
    {name:'Rent 801',         amount:0,     category:'Housing',    startMonth:'2026-04', paid:months('2026-04','2026-10')},
  ];
  bills.forEach(b => {
    if(has('obligations', b.name)) return;
    const id = uid();
    S.obligations.push({id, name:b.name, amount:b.amount, dueDay:5, category:b.category, freq:'monthly', startMonth:b.startMonth, endMonth:b.endMonth||''});
    b.paid.forEach(m => { (S.paid[m] = S.paid[m]||[]).push('obl:'+id); });
  });
  const t = today(), fix = 'Set the real renewal date and amount.';
  const rems = [
    {title:'Maintenance',                 type:'Other',     date:'2026-11-05', repeat:'3',  notes:'Paid quarterly (May, Aug). Add the amount here.'},
    {title:'Term Insurance HB',           type:'Insurance', date:'2027-04-05', repeat:'12', notes:'Last paid Apr 2026.'},
    {title:'LIC Policy',                  type:'Insurance', date:'2027-01-05', repeat:'3',  notes:'Paid quarterly (Apr, Jul, Oct 2026).'},
    {title:'TVS Jupiter Insurance',       type:'Insurance', date:'2027-08-05', repeat:'12', notes:'Last paid Aug 2026.'},
    {title:'Bear 650 Insurance',          type:'Insurance', date:'2027-09-05', repeat:'12', notes:'Last paid Sep 2026.'},
    {title:'Term Insurance AM',           type:'Insurance', date:t, repeat:'12', notes:fix},
    {title:'Medical Insurance HB + AM',   type:'Insurance', date:t, repeat:'12', notes:fix},
    {title:'Medical Insurance BK',        type:'Insurance', date:t, repeat:'12', notes:fix},
  ];
  rems.forEach(r => { if(!has('reminders', r.title)) S.reminders.push({id:uid(), ...r}); });
  S.varselImported = true; save();
}


/* ---------- display / admin panel (hidden: tap the page title 5 times, or open with #admin) ---------- */
const UI_DEF = {fs:'m', density:'compact', theme:'light', accent:'saffron'};
const FS = {s:'13px', m:'14px', l:'15.5px', xl:'17px'};
const ACCENTS = {saffron:'#E8891C', teal:'#1F8A84', indigo:'#5B5BD6', rose:'#D14B72', green:'#3F8F5B'};
function uiPrefs(){ return Object.assign({}, UI_DEF, S.settings.ui||{}); }
function applyUI(){
  const u = uiPrefs(), h = document.documentElement;
  h.style.setProperty('--fs', FS[u.fs]||FS.m);
  h.style.setProperty('--saffron', ACCENTS[u.accent]||ACCENTS.saffron);
  const dark = u.theme==='dark' || (u.theme==='auto' && !!window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  h.dataset.theme = dark ? 'dark' : 'light';
  h.classList.toggle('comfy', u.density==='comfortable');
  document.querySelector('meta[name=theme-color]').content = dark ? '#121419' : '#FAF7F2';
}
function setUI(k,v){ S.settings.ui = Object.assign(uiPrefs(), {[k]:v}); save(); applyUI(); openAdmin(); }
let taps=0, tapTimer;
function titleTap(){ taps++; clearTimeout(tapTimer); tapTimer=setTimeout(()=>taps=0, 1500); if(taps>=5){ taps=0; openAdmin(); } }
function openAdmin(){
  const u = uiPrefs();
  const chips = (k, opts) => `<div class="chips" style="flex-wrap:wrap">${opts.map(([v,l])=>`<button class="chip ${u[k]===v?'on':''}" onclick="setUI('${k}','${v}')">${l}</button>`).join('')}</div>`;
  showModal(`
    <h2>Display &amp; theme</h2>
    <p class="sub" style="margin-bottom:.8rem">Changes apply instantly and are saved on this device.</p>
    <div class="adminrow"><label>Text size</label>${chips('fs',[['s','Small'],['m','Default'],['l','Large'],['xl','Extra large']])}</div>
    <div class="adminrow"><label>Density</label>${chips('density',[['compact','Compact'],['comfortable','Comfortable']])}</div>
    <div class="adminrow"><label>Theme</label>${chips('theme',[['light','☀️ Light'],['dark','🌙 Dark'],['auto','Auto (follow phone)']])}</div>
    <div class="adminrow"><label>Accent colour</label><div class="row" style="gap:.7rem">${Object.entries(ACCENTS).map(([k,c])=>`<button class="swatch ${u.accent===k?'on':''}" style="background:${c}" title="${k}" onclick="setUI('accent','${k}')"></button>`).join('')}</div></div>
    <div class="formbtns">
      <button class="btn" onclick="S.settings.ui={...UI_DEF};save();applyUI();openAdmin()">Reset display</button>
      <button class="btn" onclick="openSettings()">‹ Settings</button>
      <button class="btn primary" onclick="closeModal()">Done</button>
    </div>`);
}
window.matchMedia && matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', ()=>{ if(uiPrefs().theme==='auto') applyUI(); });
window.addEventListener('hashchange', ()=>{ if(location.hash==='#admin') openAdmin(); });

/* ---------- v3: fixed people instead of "me/partner" (needed once data is shared) ---------- */
function migrateV3(){
  if(S.v3) return;
  S.people = {a:S.settings.me || S.people?.a || 'Hari', b:S.settings.partner || S.people?.b || 'Wife'};
  S.settings.whoami = S.settings.whoami || 'a';
  S.tasks.forEach(t=>{ if(t.assignee==='me') t.assignee='a'; else if(t.assignee==='partner') t.assignee='b'; });
  delete S.settings.me; delete S.settings.partner;
  S.v3 = true; save();
}

/* =====================  CLOUD SYNC (Supabase)  ===================== */
const COLS = ['tasks','obligations','expenses','reminders','groceries','help','dates'];
const CKEY = 'homebase.cloud', SKEY = 'homebase.synced';
let cloud = (()=>{ try{ return JSON.parse(localStorage.getItem(CKEY))||{}; }catch(e){ return {}; } })();
let synced = (()=>{ try{ return JSON.parse(localStorage.getItem(SKEY))||{}; }catch(e){ return {}; } })();
let sb = null, sbUser = null, rtChannel = null, pushTimer = null, applying = false, syncState = 'off', lastSyncAt = null, pollTimer = null;
function saveCloud(){ try{ localStorage.setItem(CKEY, JSON.stringify(cloud)); localStorage.setItem(SKEY, JSON.stringify(synced)); }catch(e){} }
function h53(str){ let h1=0xdeadbeef, h2=0x41c6ce57; for(let i=0;i<str.length;i++){ const c=str.charCodeAt(i); h1=Math.imul(h1^c,2654435761); h2=Math.imul(h2^c,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909); h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909); return (4294967296*(2097151&h2)+(h1>>>0)).toString(36); }
function snapshot(){
  const m = {};
  COLS.forEach(c=>(S[c]||[]).forEach(x=>{ m[c+'|'+x.id] = x; }));
  Object.entries(S.paid||{}).forEach(([mk,arr])=>(arr||[]).forEach(k=>{ m['paid|'+mk+'|'+k] = true; }));
  m['meta|people'] = S.people;
  return m;
}
function setSyncState(st){ syncState = st; const d = document.getElementById('syncdot'); if(d){ d.className = 'syncdot '+st; } const el=document.getElementById('cloudstatus'); if(el) el.innerHTML = cloudStatusText(); }
function cloudStatusText(){
  if(!cloud.hid) return 'Not connected';
  if(syncState==='syncing') return '🔄 Syncing…';
  if(syncState==='pending') return '🟠 Changes waiting to sync';
  if(syncState==='error') return '🔴 Offline — will sync when back online';
  return '🟢 Synced'+(lastSyncAt?' · '+lastSyncAt.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'}):'');
}
function cloudSummary(){ return cloud.hid ? 'Connected' : cloud.url ? 'Sign in' : 'Off'; }

function loadSupabaseLib(){
  if(window.supabase?.createClient) return Promise.resolve();
  return new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'; sc.onload=res; sc.onerror=()=>rej(new Error('Could not load Supabase (offline?)')); document.head.appendChild(sc); });
}
async function cloudClient(){
  if(sb) return sb;
  if(!cloud.url || !cloud.key) throw new Error('Add your Supabase URL and key first');
  await loadSupabaseLib();
  sb = window.supabase.createClient(cloud.url, cloud.key, {auth:{persistSession:true, autoRefreshToken:true, storageKey:'homebase.auth'}});
  return sb;
}
async function cloudBoot(){
  if(!cloud.url || !cloud.key) return;
  try{
    await cloudClient();
    const { data } = await sb.auth.getSession(); sbUser = data?.session?.user || null;
    if(sbUser && cloud.hid) await cloudStart();
  }catch(e){ setSyncState('error'); }
}
async function cloudStart(){
  setSyncState('syncing');
  await cloudPull(!cloud.since);
  await cloudPush();
  cloudSubscribe();
  clearInterval(pollTimer); pollTimer = setInterval(()=>{ if(document.visibilityState==='visible') cloudPull(false); }, 30000);
}
function rowApply(r){
  const key = r.col+'|'+r.id;
  if(r.updated_at && (!cloud.since || r.updated_at > cloud.since)) cloud.since = r.updated_at;
  const newHash = r.deleted ? undefined : h53(JSON.stringify(r.col==='paid' ? true : r.data));
  if(synced[key]===newHash) return false;   // nothing new (e.g. echo of our own change)
  if(COLS.includes(r.col)){
    const arr = S[r.col] = S[r.col]||[]; const i = arr.findIndex(x=>x.id===r.id);
    if(r.deleted){ if(i>=0) arr.splice(i,1); }
    else if(r.data){ if(i>=0) arr[i]=r.data; else arr.push(r.data); }
  } else if(r.col==='paid'){
    const cut = r.id.indexOf('|'), mk = r.id.slice(0,cut), k = r.id.slice(cut+1);
    const arr = S.paid[mk] = S.paid[mk]||[]; const i = arr.indexOf(k);
    if(r.deleted){ if(i>=0) arr.splice(i,1); } else if(i<0) arr.push(k);
  } else if(r.col==='meta' && r.id==='people' && !r.deleted && r.data){ S.people = r.data; }
  if(r.deleted) delete synced[key]; else synced[key] = newHash;
  return true;
}
function applyRows(rows){
  if(!rows.length) return;
  applying = true;
  let changed = false; rows.forEach(r=>{ if(rowApply(r)) changed = true; });
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  saveCloud(); applying = false;
  if(changed) safeRender();
}
let needRender = false;
function safeRender(){
  const a = document.activeElement;
  if(document.querySelector('#modal .overlay') || (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName))){ needRender = true; return; }
  render();
}
document.addEventListener('focusout', ()=>setTimeout(()=>{ if(needRender && !document.querySelector('#modal .overlay')){ needRender=false; render(); } }, 50));
async function cloudPull(full){
  if(!sb || !cloud.hid) return;
  try{
    let from = 0; const since = full || !cloud.since ? '1970-01-01T00:00:00Z' : new Date(new Date(cloud.since).getTime()-2000).toISOString();
    for(;;){
      const { data, error } = await sb.from('items').select('*').eq('household_id', cloud.hid).gte('updated_at', since).order('updated_at',{ascending:true}).range(from, from+499);
      if(error) throw error;
      applyRows(data||[]);
      if(!data || data.length<500) break; from += 500;
    }
    lastSyncAt = new Date(); setSyncState(pendingChanges().length ? 'pending' : 'ok');
  }catch(e){ setSyncState('error'); }
}
function pendingChanges(){
  const snap = snapshot(), rows = [];
  Object.entries(snap).forEach(([key,val])=>{ const hh = h53(JSON.stringify(val)); if(synced[key]!==hh) rows.push({key, hh, val}); });
  Object.keys(synced).forEach(key=>{ if(!(key in snap)) rows.push({key, del:true}); });
  return rows;
}
function cloudSchedulePush(){
  if(applying || !sb || !cloud.hid) return;
  setSyncState('pending'); clearTimeout(pushTimer); pushTimer = setTimeout(cloudPush, 700);
}
let pushing = false;
async function cloudPush(){
  if(!sb || !cloud.hid || pushing) return;
  const ch = pendingChanges(); if(!ch.length){ setSyncState('ok'); return; }
  pushing = true; setSyncState('syncing');
  try{
    for(let i=0;i<ch.length;i+=100){
      const part = ch.slice(i,i+100);
      const rows = part.map(c=>{ const cut=c.key.indexOf('|'); return {household_id:cloud.hid, col:c.key.slice(0,cut), id:c.key.slice(cut+1), data:c.del?null:c.val, deleted:!!c.del}; });
      const { error } = await sb.from('items').upsert(rows, {onConflict:'household_id,col,id'});
      if(error) throw error;
      part.forEach(c=>{ if(c.del) delete synced[c.key]; else synced[c.key]=c.hh; });
      saveCloud();
    }
    lastSyncAt = new Date(); pushing = false;
    setSyncState(pendingChanges().length ? 'pending' : 'ok');
    if(pendingChanges().length) cloudSchedulePush();
  }catch(e){ pushing = false; setSyncState('error'); clearTimeout(pushTimer); pushTimer = setTimeout(cloudPush, 15000); }
}
function cloudSubscribe(){
  if(rtChannel) sb.removeChannel(rtChannel);
  rtChannel = sb.channel('hb-'+cloud.hid)
    .on('postgres_changes', {event:'*', schema:'public', table:'items', filter:'household_id=eq.'+cloud.hid}, p=>{ if(p.new && p.new.col) applyRows([p.new]); lastSyncAt=new Date(); setSyncState(syncState==='error'?'ok':syncState); })
    .subscribe();
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && sb && cloud.hid){ cloudPull(false).then(cloudPush); } });
window.addEventListener('online', ()=>{ if(sb && cloud.hid){ cloudPull(false).then(cloudPush); } });

/* ---------- cloud UI ---------- */
function openCloud(msg){
  const err = msg ? `<p class="sub" style="color:var(--red);margin:.4rem 0">${esc(msg)}</p>` : '';
  const back = `<button type="button" class="btn" onclick="openSettings()">‹ Settings</button>`;
  if(!cloud.url || !cloud.key){
    return showModal(`<h2>☁️ Cloud sync</h2>
      <p class="sub">Share HomeBase with your spouse. Paste the two values from your Supabase project (Project URL and the publishable key).</p>${err}
      <form onsubmit="event.preventDefault();cloudSaveKeys(this)">
        <label>Project URL</label><input name="url" placeholder="https://xxxx.supabase.co" autocomplete="off" autocapitalize="off" required>
        <label>Publishable key</label><input name="key" placeholder="sb_publishable_… or eyJ…" autocomplete="off" autocapitalize="off" required>
        <div class="formbtns">${back}<button class="btn primary">Continue</button></div>
      </form>`);
  }
  if(!sbUser){
    return showModal(`<h2>☁️ Sign in</h2>
      <p class="sub">Each of you uses your own email and password.</p>${err}
      <form onsubmit="event.preventDefault()">
        <label>Email</label><input name="email" type="email" autocomplete="username" autocapitalize="off" required>
        <label>Password</label><input name="pw" type="password" autocomplete="current-password" minlength="6" required>
        <div class="formbtns">
          <button type="button" class="btn" onclick="cloudAuth(this.form,'up')">Create account</button>
          <button type="button" class="btn primary" onclick="cloudAuth(this.form,'in')">Sign in</button>
        </div>
      </form>
      <div class="actions">${back}<button class="btn danger" onclick="cloudForget()">Change Supabase keys</button></div>`);
  }
  if(!cloud.hid){
    return showModal(`<h2>☁️ Your household</h2>
      <p class="sub">Signed in as ${esc(sbUser.email)}.</p>${err}
      <div class="card"><div class="title">Start a household</div><p class="sub" style="margin:.2rem 0 .5rem">You'll get an invite code for your spouse. Everything on this phone is uploaded.</p>
        <button class="btn primary" onclick="cloudCreate()">Create household</button></div>
      <div class="card"><div class="title">Join your spouse's household</div><p class="sub" style="margin:.2rem 0 .3rem">Enter the 6-letter code from their phone. This phone's current data will be replaced with the shared data.</p>
        <form class="quickadd" onsubmit="event.preventDefault();cloudJoin(this.elements.code.value)"><input name="code" placeholder="e.g. 7F3K2A" autocapitalize="characters" autocomplete="off" maxlength="6"><button class="btn primary">Join</button></form></div>
      <div class="actions">${back}<button class="btn" onclick="cloudSignOut()">Sign out</button></div>`);
  }
  const wa = encodeURIComponent(`Join our HomeBase 🏠\n1. Open ${location.origin}\n2. ⚙︎ Settings → Cloud sync, paste the same Supabase URL and key\n3. Create your account and join with code: ${cloud.code||''}`);
  showModal(`<h2>☁️ Cloud sync</h2>${err}
    <div class="card"><div class="sub">Status</div><div class="title" id="cloudstatus">${cloudStatusText()}</div>
      <div class="sub" style="margin-top:.3rem">${esc(sbUser.email)} · you are <b style="color:var(--ink)">${esc(who(me()))}</b></div></div>
    <div class="card" style="text-align:center"><div class="sub">Invite code for your spouse</div>
      <div class="mtitle big" style="letter-spacing:4px;margin:.2rem 0">${esc(cloud.code||'——')}</div>
      <div class="actions" style="justify-content:center"><a class="btn" href="https://wa.me/?text=${wa}" target="_blank" rel="noopener">Send on WhatsApp</a></div></div>
    <div class="actions">

async function cloudSaveKeys(f){
  let url = f.elements.url.value.trim().replace(/\/+$/,'').replace(/\/rest\/v1$/,''); const key = f.elements.key.value.trim();
  if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)) return openCloud('That URL should look like https://xxxx.supabase.co');
  cloud.url = url; cloud.key = key; sb = null; saveCloud();
  try{ await cloudClient(); openCloud(); }catch(e){ openCloud(e.message); }
}
async function cloudAuth(f, mode){
  if(!f.reportValidity()) return;
  try{
    await cloudClient();
    const creds = {email:f.elements.email.value.trim(), password:f.elements.pw.value};
    const { data, error } = mode==='up' ? await sb.auth.signUp(creds) : await sb.auth.signInWithPassword(creds);
    if(error) throw error;
    sbUser = data.user || data.session?.user;
    if(!data.session) throw new Error('Account created, but email confirmation is on. Turn off "Confirm email" in Supabase, then sign in.');
    if(cloud.hid) await cloudStart();
    openCloud();
  }catch(e){ openCloud(e.message||'Sign-in failed'); }
}
async function cloudCreate(){
  try{
    const { data, error } = await sb.rpc('create_household', {p_name:'Home'});
    if(error) throw error;
    const h = Array.isArray(data) ? data[0] : data;
    cloud.hid = h.id; cloud.code = h.invite_code; cloud.since = null; synced = {}; S.settings.whoami = S.settings.whoami || 'a';
    saveCloud(); save(); await cloudStart(); openCloud(); toast('Household created — share the code');
  }catch(e){ openCloud(e.message||'Could not create household'); }
}
async function cloudJoin(code){
  code = (code||'').trim().toUpperCase(); if(code.length<6) return openCloud('Enter the 6-letter code');
  if(!confirm("This phone's current HomeBase data will be replaced with your household's shared data. Continue?")) return;
  try{
    const { data, error } = await sb.rpc('join_household', {p_code:code});
    if(error) throw error;
    const st = S.settings; S = blank(); S.settings = {...st, whoami:'b'}; S.varselImported = S.v2 = S.v3 = true;
    cloud.hid = data; cloud.code = code; cloud.since = null; synced = {};
    applying = true; try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} applying = false; saveCloud();
    await cloudStart(); render(); openCloud(); toast('Joined! Data synced 🎉');
  }catch(e){ openCloud(e.message||'Could not join'); }
}
function cloudSwapMe(){ S.settings.whoami = other(); applying = true; try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} applying = false; render(); openCloud(); }
async function cloudSignOut(disconnect){
  try{ if(rtChannel) sb.removeChannel(rtChannel); await sb?.auth.signOut(); }catch(e){}
  clearInterval(pollTimer); rtChannel = null; sbUser = null;

function feed(){
  const out = [], cur = monthKey();
  S.obligations.forEach(o=>{
    for(let k=-2;k<=24;k++){
      const m = monthKey(addMonths(cur+'-01',k));
      if(!oblApplies(o,m) || isPaid('obl:'+o.id,m)) continue;
      out.push({kind:'pay', id:o.id, mk:m, src:'💰', title:o.name, sub:inr(o.amount)+(freqOf(o)!=='monthly'?' · '+FREQ_LABEL[freqOf(o)]:'')+' · '+(o.category||''), date:oblDue(o,m), lead:remindOf(o), go:`ui.oblMonth='${m}';go('money','obligations')`});
      break;   // only the earliest unpaid one; ticking it reveals the next
    }
  });
  S.reminders.filter(r=>!r.done).forEach(r=>out.push({kind:'rem', id:r.id, src:REM_ICON[r.type]||'📌', title:r.title, sub:r.type+(r.repeat&&r.repeat!=='0'?' · '+REP_LABEL[r.repeat]:''), date:r.date, lead:remindOf(r), go:"go('reminders')"}));
  S.tasks.filter(t=>!t.done && t.due).forEach(t=>out.push({kind:'task', id:t.id, src:'✅', title:t.title, sub:'Task · '+who(t.assignee), date:t.due, lead:7, go:"go('tasks')"}));

const FREQ = {monthly:1, quarterly:3, half:6, yearly:12, once:0};
const FREQ_LABEL = {monthly:'Monthly', quarterly:'Quarterly', half:'Half-yearly', yearly:'Yearly', once:'One-time'};
const OBL_CATS = ['Housing','Loan / EMI','Utilities','Insurance','Subscription','Education','Investment / SIP','Maintenance','Other'];
function freqOf(o){ return FREQ[o.freq]!==undefined ? o.freq : 'monthly'; }
function remindOf(x){ const n = Number(x.remindDays); return isNaN(n) || x.remindDays==='' || x.remindDays==null ? (x.freq && freqOf(x)!=='monthly' ? 15 : 3) : n; }
function monthsBetween(a,b){ const [ay,am]=a.split('-').map(Number), [by,bm]=b.split('-').map(Number); return (by-ay)*12+(bm-am); }
function viewMoney(){

function oblApplies(o, mk){
  const n = FREQ[freqOf(o)];
  if(n===0) return o.startMonth===mk;
  if(o.endMonth && mk>o.endMonth) return false;
  if(!o.startMonth) return n===1;
  const d = monthsBetween(o.startMonth, mk);
  return d>=0 && d%n===0;
}
function ord(n){ const s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }

/* ---------- phone calendar (.ics) ---------- */
function icsEsc(t){ return String(t||'').replace(/\\/g,'\\\\').replace(/;/g,'\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
function icsEvent(x){
  const d = x.date.replace(/-/g,''), stamp = new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const L = ['BEGIN:VEVENT','UID:'+x.uid+'@homebase','DTSTAMP:'+stamp,'DTSTART:'+d+'T090000','DTEND:'+d+'T093000','SUMMARY:'+icsEsc(x.title),'DESCRIPTION:'+icsEsc(x.desc)];
  if(x.rrule) L.push('RRULE:'+x.rrule);
  if(x.lead>0) L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(x.title),'TRIGGER:-P'+x.lead+'D','END:VALARM');
  L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(x.title),'TRIGGER:PT0M','END:VALARM','END:VEVENT');
  return L.join('\r\n');
}
function icsFromObligation(o){
  const f = freqOf(o), n = FREQ[f], cur = monthKey();
  let mk = null;
  for(let k=0;k<36;k++){ const m = monthKey(addMonths(cur+'-01',k)); if(oblApplies(o,m) && !isPaid('obl:'+o.id,m)){ mk=m; break; } }
  if(!mk) return null;
  const last = o.dueDay>28, date = last ? ymd(new Date(+mk.slice(0,4), +mk.slice(5,7), 0)) : oblDue(o,mk);
  let rrule = n ? `FREQ=MONTHLY;INTERVAL=${n};BYMONTHDAY=${last?-1:o.dueDay}` : null;
  if(rrule && o.endMonth){ const e = new Date(+o.endMonth.slice(0,4), +o.endMonth.slice(5,7), 0); rrule += ';UNTIL='+ymd(e).replace(/-/g,'')+'T235959'; }
  return {uid:'obl-'+o.id, title:`Pay: ${o.name}${Number(o.amount)?' ('+inr(o.amount)+')':''}`, desc:`${FREQ_LABEL[f]} · ${o.category||''}${o.notes?'\n'+o.notes:''}`, date, rrule, lead:remindOf(o)};
}
function icsFromReminder(r){
  return {uid:'rem-'+r.id, title:r.title, desc:r.type+(r.notes?'\n'+r.notes:''), date:r.date, rrule: r.repeat&&r.repeat!=='0' ? `FREQ=MONTHLY;INTERVAL=${r.repeat}` : null, lead:remindOf(r)};
}
function downloadICS(name, events){
  if(!events.length) return toast('Nothing to add');
  const text = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//HomeBase//EN','CALSCALE:GREGORIAN', ...events.map(icsEvent), 'END:VCALENDAR'].join('\r\n');
  if(/iPhone|iPad|iPod/.test(navigator.userAgent)){ location.href = 'data:text/calendar;charset=utf-8,'+encodeURIComponent(text); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text],{type:'text/calendar'})); a.download = name+'.ics'; a.click();
  toast('Calendar file downloaded — open it to add');
}
function calendarFor(kind, id){
  if(kind==='obligation'){ const e = icsFromObligation(S.obligations.find(x=>x.id===id)); downloadICS('homebase-'+id, e?[e]:[]); }
  else downloadICS('homebase-'+id, [icsFromReminder(S.reminders.find(x=>x.id===id))]);
}
function calendarAll(){
  const ev = [...S.obligations.map(icsFromObligation).filter(Boolean), ...S.reminders.filter(r=>!r.done).map(icsFromReminder)];
  downloadICS('homebase-all', ev);
}

/* ---------- one-time upgrade: payments move from Reminders/Subscriptions into Obligations ---------- */
function migrateV2(){
  if(S.v2) return;
  const H = {
    'Maintenance':{freq:'quarterly',start:'2026-05',paid:['2026-05','2026-08'],cat:'Maintenance'},
    'Term Insurance HB':{freq:'yearly',start:'2026-04',paid:['2026-04']},
    'LIC Policy':{freq:'quarterly',start:'2026-04',paid:['2026-04','2026-07','2026-10']},
    'TVS Jupiter Insurance':{freq:'yearly',start:'2026-08',paid:['2026-08']},
    'Bear 650 Insurance':{freq:'yearly',start:'2026-09',paid:['2026-09']},
  };
  const R2F = {'1':'monthly','3':'quarterly','6':'half','12':'yearly','0':'once'};
  S.reminders.filter(r=>r.type==='Insurance' || r.title==='Maintenance').forEach(r=>{
    const h = H[r.title], id = uid();
    S.obligations.push({id, name:r.title, amount:r.cost||0, category:h?.cat || (r.type==='Insurance'?'Insurance':'Other'),
      freq:h?.freq || R2F[r.repeat] || 'yearly', startMonth:h?.start || monthKey(r.date), endMonth:'',
      dueDay:h?5:parse(r.date).getDate(), remindDays:'15', notes:h?'':(r.notes||'')});
    (h?.paid||[]).forEach(m=>{ (S.paid[m]=S.paid[m]||[]).push('obl:'+id); });
  });
  S.reminders = S.reminders.filter(r=>!(r.type==='Insurance' || r.title==='Maintenance'));
  (S.subs||[]).forEach(x=>S.obligations.push({id:uid(), name:x.name, amount:x.amount, category:'Subscription', freq:x.cycle==='yearly'?'yearly':'monthly',
    startMonth:monthKey(x.renew), endMonth:'', dueDay:parse(x.renew).getDate(), remindDays:'3', notes:''}));
  S.subs = [];
  S.obligations.forEach(o=>{ if(!o.freq) o.freq='monthly'; if(o.category==='Insurance premium') o.category='Insurance'; if(o.remindDays==null) o.remindDays = o.freq==='monthly'?'3':'15'; });
  S.v2 = true; save();
}

/* ---------- HOUSEHOLD ---------- */
function viewHouse(){
  const tabs = [['groceries','Groceries'],['help','House help'],['dates','Important dates']];
  const body = {groceries:viewGroceries, help:viewHelp, dates:viewDates}[ui.house]();
  return `    <div class="chips">${tabs.map(([k,l])=>`<button class="chip ${ui.house===k?'on':''}" onclick="ui.house='${k}';render()">${l}</button>`).join('')}</div>${body}`;
}
function viewGroceries(){
  const list = [...S.groceries].sort((a,b)=>a.done-b.done);
  const bought = list.filter(g=>g.done).length;
  return `
    <form class="quickadd" onsubmit="event.preventDefault();addGrocery(this)">
      <input name="name" placeholder="Add item, e.g. Milk" autocomplete="off">
      <input name="qty" placeholder="Qty" autocomplete="off">
      <button class="btn primary">Add</button>
    </form>
    ${list.length ? list.map(g=>`
      <div class="card row ${g.done?'done':''}">
        <button class="check ${g.done?'on':''}" onclick="toggleGrocery('${g.id}')">✓</button>
        <div class="grow"><div class="title">${esc(g.name)}</div>${g.qty?`<div class="meta">${esc(g.qty)}</div>`:''}</div>
        <button class="iconbtn sm" onclick="del('groceries','${g.id}',true)">✕</button>
      </div>`).join('') : `<div class="empty">Shopping list is empty.</div>`}
    ${bought ? `<button class="btn" style="width:100%;margin-top:6px" onclick="S.groceries=S.groceries.filter(g=>!g.done);save();render()">Clear ${bought} bought item${bought>1?'s':''}</button>` : ''}
  `;
}
function addGrocery(f){ const n=f.elements.name.value.trim(); if(!n) return; S.groceries.push({id:uid(),name:n,qty:f.elements.qty.value.trim(),done:false}); save(); render(); document.querySelector('.quickadd input').focus(); }
function toggleGrocery(id){ const g=S.groceries.find(x=>x.id===id); g.done=!g.done; save(); render(); }
function viewHelp(){
  const mk = monthKey();
  return `
    <p class="sub" style="margin-bottom:.6rem">Maid, cook, driver — leaves and salary for ${monthName(mk)}.</p>
    ${S.help.length ? S.help.map(h=>{ const lv=(h.leaves||[]).filter(d=>monthKey(d)===mk); const p=isPaid('help:'+h.id,mk); return `
      <div class="card">
        <div class="row">
          <div class="grow"><div class="title">${esc(h.name)}</div><div class="meta">${esc(h.role)} · ${inr(h.pay)}/month ${h.phone?'· '+esc(h.phone):''}</div></div>
          <span class="pill ${p?'ok':'later'}">${p?'Salary paid':'Salary due'}</span>
        </div>
        <p class="sub" style="margin-top:.4rem">Leaves this month: <b style="color:var(--ink)">${lv.length}</b>${lv.length?' ('+lv.map(fmtDate).join(', ')+')':''}</p>
        <div class="actions">
          <button class="btn" onclick="addLeave('${h.id}')">+ Leave today</button>
          <button class="btn ${p?'':'accent'}" onclick="togglePaid('help:${h.id}')">${p?'Undo paid':'Mark salary paid'}</button>
          <button class="btn" onclick="openForm('help','${h.id}')">Edit</button>
        </div>
      </div>`;}).join('') : `<div class="empty">Add your maid, cook or driver to track leaves and salary.</div>`}
  `;
}
function addLeave(id){
  const h=S.help.find(x=>x.id===id); h.leaves=h.leaves||[]; const t=today();
  if(h.leaves.includes(t)){ h.leaves=h.leaves.filter(d=>d!==t); toast('Removed today\'s leave'); } else { h.leaves.push(t); toast('Leave marked for today'); }
  save(); render();
}
function viewDates(){
  const list = S.dates.map(d=>({...d,next:nextOccurrence(d.date)})).sort((a,b)=>a.next.localeCompare(b.next));
  const icon = {Birthday:'🎂',Anniversary:'💍',Festival:'🪔',Other:'📅'};
  return `
    ${list.length ? list.map(d=>`
      <div class="card row" onclick="openForm('date','${d.id}')" style="cursor:pointer">
        <div class="src">${icon[d.type]||'📅'}</div>
        <div class="grow"><div class="title">${esc(d.name)}</div><div class="meta">${esc(d.type)} · ${fmtDate(d.date)}</div></div>
        ${dueTag(d.next)}
      </div>`).join('') : `<div class="empty">Birthdays, anniversaries, family functions — never miss one.</div>`}
  `;
}

  obligation:{col:'obligations',title:'Obligation',fields:()=>[

    {k:'cost',l:'Usual cost (₹, optional)',t:'number',ph:'Offered as an expense when done'},
    {k:'notes',l:'Notes',t:'textarea',ph:'Service centre, document no., etc.'}], def:()=>({type:'Vehicle service',repeat:'6',date:today(),remindDays:'7'})},
  help:{col:'help',title:'House help',fields:()=>[
    {k:'name',l:'Name',t:'text',req:1},
    {k:'role',l:'Role',t:'select',o:['Maid','Cook','Driver','Nanny','Gardener','Other'].map(x=>[x,x])},
    {k:'pay',l:'Monthly salary (₹)',t:'number'},

  date:{col:'dates',title:'Important date',fields:()=>[

let tempPhoto = null;
function openForm(kind, id){
  const F = FORMS[kind]; const item = id ? S[F.col].find(x=>x.id===id) : F.def();
  tempPhoto = item.photo || null;
  const fields = F.fields().map(f=>{
    const v = item[f.k] ?? '';
    if(f.t==='photo') return `<label>${f.l}</label>
      <div class="photobox" onclick="document.getElementById('ph').click()" id="phbox">${tempPhoto?`<img src="${tempPhoto}">`:'📷 Tap to take or choose a photo'}</div>
      <input type="file" id="ph" accept="image/*" capture="environment" style="display:none" onchange="pickPhoto(this)">
      ${tempPhoto?`<button type="button" class="btn danger" style="margin-top:6px" onclick="tempPhoto=null;document.getElementById('phbox').innerHTML='📷 Tap to take or choose a photo';this.remove()">Remove photo</button>`:''}`;
    if(f.t==='select') return `<label>${f.l}</label><select name="${f.k}">${f.o.map(([val,lab])=>`<option value="${esc(val)}" ${String(v)===String(val)?'selected':''}>${esc(lab)}</option>`).join('')}</select>`;
    if(f.t==='textarea') return `<label>${f.l}</label><textarea name="${f.k}" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea>`;
    return `<label>${f.l}</label><input name="${f.k}" type="${f.t}" value="${esc(v)}" placeholder="${esc(f.ph||'')}" ${f.req?'required':''} ${f.t==='number'?'inputmode="decimal" step="any"':''}>`;
  }).join('');
  showModal(`
    <h2>${id?'Edit':'New'} ${F.title.toLowerCase()}</h2>
    <form onsubmit="event.preventDefault();saveForm('${kind}','${id||''}',this)">
      ${fields}
      ${id && (kind==='obligation'||kind==='reminder') ? `<button type="button" class="btn" style="width:100%;margin-top:.9rem" onclick="calendarFor('${kind}','${id}')">📅 Add to phone calendar</button>` : ''}
      <div class="formbtns">
        ${id?`<button type="button" class="btn danger" onclick="del('${F.col}','${id}')">Delete</button>`:''}
        <button type="button" class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn primary">Save</button>
      </div>
    </form>`);
}
async function pickPhoto(inp){
  const f = inp.files[0]; if(!f) return;
  try{ tempPhoto = await compress(f); document.getElementById('phbox').innerHTML = `<img src="${tempPhoto}">`; }
  catch(e){ toast('Could not read that image'); }
}
function saveForm(kind, id, form){
  const F = FORMS[kind]; const data = {};
  F.fields().forEach(f=>{
    if(f.t==='photo'){ data.photo = tempPhoto; return; }
    let v = form.elements[f.k].value.trim();
    if(f.t==='number' && v!=='') v = Number(v);
    data[f.k] = v;
  });
  if(kind==='obligation'){ data.dueDay = Math.min(31, Math.max(1, Math.round(data.dueDay)||1)); if(!data.startMonth) data.startMonth=ui.oblMonth; if(data.freq==='once'){ data.endMonth=''; } if(data.endMonth && data.endMonth<data.startMonth){ toast('End month is before start month'); return; } }
  if(id){ Object.assign(S[F.col].find(x=>x.id===id), data); }
  else { S[F.col].push({...F.def(), ...data, id:uid()}); }
  save(); closeModal(); render(); toast('Saved');
}
function del(col, id, quiet){
  if(!quiet && !confirm('Delete this?')) return;
  const i = S[col].findIndex(x=>x.id===id); if(i<0) return; const item = S[col][i];
  S[col].splice(i,1); ui.expanded=null; save(); closeModal(); render();
  toast('Deleted', ()=>{ S[col].splice(i,0,item); save(); render(); });
}
function showModal(html){ document.getElementById('modal').innerHTML = `<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet">${html}</div></div>`; }
function closeModal(){ document.getElementById('modal').innerHTML=''; if(needRender){ needRender=false; render(); } }

/* ---------- FAB ---------- */

  if(ui.view==='tasks') return openForm('task');
  if(ui.view==='money') return openForm(ui.money==='expenses'?'expense':'obligation');

  showModal(`<h2>Quick add</h2><div class="choose">
    <button onclick="openForm('task')"><span>📸</span>Task</button>
    <button onclick="openForm('expense')"><span>💸</span>Expense</button>
    <button onclick="openForm('obligation')"><span>💰</span>Obligation</button>
    <button onclick="openForm('reminder')"><span>🔔</span>Reminder</button>
    <button onclick="openForm('date')"><span>🎂</span>Important date</button>
  </div>`);
}

/* ---------- settings ---------- */
function openSettings(){
  showModal(`
    <h2>Settings</h2>
    <button class="btn" style="width:100%;display:flex;justify-content:space-between;align-items:center" onclick="openAdmin()"><span>🎨 Display &amp; theme</span><span class="sub">Text size, dark mode, colour ›</span></button>
    <button class="btn" style="width:100%;display:flex;justify-content:space-between;align-items:center;margin-top:.5rem" onclick="openCloud()"><span>☁️ Cloud sync</span><span class="sub">${cloudSummary()} ›</span></button>
    <form onsubmit="event.preventDefault();saveNames(this)">
      <label>Your name</label><input name="myname" value="${esc(who(me()))}" autocomplete="off">
      <label>Spouse's name</label><input name="spousename" value="${esc(who(other()))}" autocomplete="off">
      <div class="formbtns"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save names</button></div>
    </form>
    <h3>Your data</h3>
    <p class="sub">${cloud.hid ? 'Synced with your household. A backup export is still a good idea now and then.' : 'Stored on this phone only. Export a backup now and then.'}</p>
    <div class="actions">
      <button class="btn" onclick="calendarAll()">📅 Add all to phone calendar</button>
      <button class="btn" onclick="exportData()">⬇ Export backup</button>
      <button class="btn" onclick="document.getElementById('imp').click()">⬆ Import backup</button>
      <input type="file" id="imp" accept="application/json" style="display:none" onchange="importData(this)">
      ${S.sample?`<button class="btn" onclick="clearSample()">Clear sample data</button>`:''}
      <button class="btn danger" onclick="if(confirm(cloud.hid?'Erase everything — on this phone AND for everyone in your household?':'Erase everything?')){const st=S.settings,pp=S.people;S=blank();S.settings=st;S.people=pp;S.varselImported=S.v2=S.v3=true;save();closeModal();render()}">Erase all</button>
    </div>`);
}
function saveNames(f){
  const mine = f.elements.myname.value.trim() || 'Me', theirs = f.elements.spousename.value.trim() || 'Partner';
  S.people = {...S.people, [me()]:mine, [other()]:theirs}; save(); closeModal(); render(); toast('Names saved');
}
function clearSample(){ const st=S.settings, pp=S.people; S=blank(); S.settings=st; S.people=pp; S.varselImported=S.v2=S.v3=true; save(); closeModal(); render(); toast('Fresh start ✨'); }
function exportData(){
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));
  a.download=`homebase-backup-${today()}.json`; a.click();
}
function importData(inp){
  const f=inp.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ S=Object.assign(blank(),JSON.parse(r.result)); save(); closeModal(); render(); toast('Backup restored'); }catch(e){ toast('That file is not a valid backup'); } };
  r.readAsText(f);
}

S = load();
applyUI();
migrateV2();
migrateV3();
render();
cloudBoot();
if(location.hash==='#admin') openAdmin();
